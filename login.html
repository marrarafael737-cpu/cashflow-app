<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.A.S.H. Unit - Acesso Seguro ao Núcleo</title>
    
    <!-- Meta Tags SEO -->
    <meta name="description" content="Acesse sua conta no C.A.S.H. Unit. Gestão financeira inteligente com IA.">
    <meta name="theme-color" content="#09090b">
    
    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://*; connect-src 'self' https://wecvchpyutwjqxoeilgq.supabase.co; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">
    
    <!-- Fontes Premium -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    
    <!-- Ícones -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    
    <!-- Estilos Base & Componentes -->
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/mascot.css">

    <style>
        :root {
            --glass-bg: rgba(13, 13, 18, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
        }

        body {
            background-color: #050507;
            background-image: 
                radial-gradient(circle at 10% 10%, rgba(255, 122, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 122, 0, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            color: #fff;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            z-index: 10;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .auth-card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, rgba(255,122,0,0.05) 0%, transparent 50%);
            pointer-events: none;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-mascot-container {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-mascot-svg {
            width: 130px;
            height: 130px;
            filter: drop-shadow(0 0 20px rgba(255, 122, 0, 0.15));
        }

        .auth-speech {
            background: rgba(255, 122, 0, 0.1);
            border: 1px solid rgba(255, 122, 0, 0.2);
            color: var(--color-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 16px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            font-weight: 600;
            max-width: 90%;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        .auth-speech::after {
            content: '';
            position: absolute;
            bottom: -6px;
            left: 50%;
            transform: translateX(-50%);
            border-left: 6px solid transparent;
            border-right: 6px solid transparent;
            border-top: 6px solid rgba(255, 122, 0, 0.15);
        }

        @keyframes float {
            0%, 100% { transform: translateY(0); }
            50% { transform: translateY(-6px); }
        }

        .auth-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.5rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            line-height: 1;
        }

        .auth-logo span {
            color: var(--color-primary);
            background: linear-gradient(135deg, #FF7A00 0%, #FFB800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .auth-subtitle {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-top: 0.5rem;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.6rem;
            font-size: 0.85rem;
            font-weight: 600;
            color: rgba(255,255,255,0.7);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255,255,255,0.3);
            font-size: 1.1rem;
            transition: all 0.3s ease;
        }

        .input-with-icon input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 1.1rem 1.25rem 1.1rem 3.5rem;
            color: #fff;
            font-size: 1rem;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            box-sizing: border-box;
        }

        .input-with-icon input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--color-primary);
            box-shadow: 0 0 0 4px rgba(255, 122, 0, 0.1);
            outline: none;
        }

        .input-with-icon input:focus + i {
            color: var(--color-primary);
            transform: translateY(-50%) scale(1.1);
        }

        .btn-primary {
            width: 100%;
            background: #FF7A00 !important; /* Fallback */
            background: linear-gradient(135deg, #FF7A00 0%, #FF5C00 100%) !important;
            color: #000 !important;
            border: none;
            border-radius: 16px;
            padding: 1.25rem;
            font-size: 1.1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.4s cubic-bezier(0.165, 0.84, 0.44, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
            box-shadow: 0 10px 20px -5px rgba(255, 92, 0, 0.3);
            position: relative;
            z-index: 5;
            opacity: 1 !important;
            visibility: visible !important;
        }

        .btn-primary:hover {
            transform: translateY(-3px);
            filter: brightness(1.1);
            box-shadow: 0 15px 30px -5px rgba(255, 92, 0, 0.5);
        }

        .btn-primary:active {
            transform: translateY(-1px);
        }

        .btn-primary i {
            font-size: 0.9rem;
            transition: transform 0.3s ease;
        }

        .btn-primary:hover i {
            transform: translateX(4px);
        }

        .auth-footer {
            margin-top: 2.5rem;
            text-align: center;
            border-top: 1px solid rgba(255,255,255,0.05);
            padding-top: 2rem;
        }

        .auth-footer p {
            color: var(--color-text-muted);
            font-size: 0.95rem;
            margin-bottom: 1.5rem;
        }

        .auth-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 700;
            margin-left: 0.5rem;
        }

        .auth-footer a:hover {
            text-decoration: underline;
        }

        .trust-signals {
            display: flex;
            justify-content: center;
            gap: 2rem;
            opacity: 0.5;
        }

        .trust-item {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            font-size: 0.75rem;
            font-weight: 700;
            color: var(--color-text-muted);
            text-transform: uppercase;
            letter-spacing: 0.1em;
        }

        .loading-dots::after {
            content: '...';
            animation: dots 1.5s infinite;
        }

        @keyframes dots {
            0% { content: '.'; }
            33% { content: '..'; }
            66% { content: '...'; }
        }

        /* SVG Cashy Styles */
        .cashy-visor { fill: #000; }
        .cashy-eye { fill: var(--color-primary); filter: drop-shadow(0 0 5px var(--color-primary)); }
    </style>
</head>
<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <header class="auth-header">
                <div class="auth-mascot-container">
                    <div class="auth-speech">
                        <span id="auth-mascot-msg">Aguardando autorização no núcleo...</span>
                    </div>
                    <!-- Mascot Premium -->
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="auth-mascot-svg">
                        <defs>
                            <linearGradient id="bodyGradAuth" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#25252b" />
                                <stop offset="100%" style="stop-color:#0f0f12" />
                            </linearGradient>
                        </defs>
                        <!-- Cabeça -->
                        <rect x="50" y="50" width="100" height="90" rx="32" fill="url(#bodyGradAuth)" stroke="rgba(255,255,255,0.05)" stroke-width="1" />
                        <!-- Orelhas -->
                        <circle cx="55" cy="65" r="12" fill="#1a1a1f" stroke="var(--color-primary)" stroke-width="2" />
                        <circle cx="145" cy="65" r="12" fill="#1a1a1f" stroke="var(--color-primary)" stroke-width="2" />
                        <!-- Visor -->
                        <rect x="62" y="78" width="76" height="34" rx="17" class="cashy-visor" />
                        <!-- Olhos -->
                        <g id="cashy-eyes">
                            <rect x="75" y="90" width="16" height="5" rx="2.5" class="cashy-eye" />
                            <rect x="109" y="90" width="16" height="5" rx="2.5" class="cashy-eye" />
                        </g>
                    </svg>
                </div>
                
                <h1 class="auth-logo">C.A.S.H. <span>Unit</span></h1>
                <p class="auth-subtitle">Acesso Restrito • Gestão Patrimonial IA</p>
            </header>

            <!-- Toast Container -->
            <div id="toast-container"></div>

            <form id="login-form">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail de Operador</label>
                    <div class="input-with-icon">
                        <i class="fas fa-id-card"></i>
                        <input type="email" id="email" required placeholder="exemplo@cashunit.com" autocomplete="email">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Chave Criptográfica</label>
                    <div class="input-with-icon">
                        <i class="fas fa-key"></i>
                        <input type="password" id="password" required placeholder="••••••••" autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary" style="opacity: 1 !important; visibility: visible !important;">
                    <span>Sincronizar Acesso</span>
                    <i class="fas fa-bolt"></i>
                </button>
            </form>

            <footer class="auth-footer">
                <p>Novo operador? <a href="cadastro.html">Solicitar Credenciais</a></p>
                
                <div class="trust-signals">
                    <div class="trust-item">
                        <i class="fas fa-lock"></i>
                        <span>SSL 256-bit</span>
                    </div>
                    <div class="trust-item">
                        <i class="fas fa-shield-halved"></i>
                        <span>AES 256</span>
                    </div>
                </div>
            </footer>
        </div>
    </main>

    <!-- Core Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.2/dist/umd/supabase.min.js" integrity="sha384-3wUKeH0DH4hNxURtHPXhI66xVWrl+tDWOz20ylXdf6ph1BV3ylCCElOLZ83PH/kM" crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" integrity="sha384-d+vyQ0dYcymoP8ndq2hW7FGC50nqGdXUEgoOUGxbbkAJwZqL7h+jKN0GGgn9hFDS" crossorigin="anonymous"></script>
    
    <script>
        // Animações de Entrada
        document.addEventListener('DOMContentLoaded', () => {
            const tl = gsap.timeline();
            tl.from(".auth-card", { scale: 0.95, opacity: 0, duration: 1, ease: "expo.out" })
              .from(".auth-mascot-container", { y: -20, opacity: 0, duration: 0.8, ease: "back.out(1.7)" }, "-=0.5")
              .from(".auth-logo", { y: 10, opacity: 0, duration: 0.6 }, "-=0.4")
              .from(".form-group", { x: -20, opacity: 0, stagger: 0.1, duration: 0.6 }, "-=0.3")
              .from(".btn-primary", { y: 20, opacity: 0, duration: 0.6 }, "-=0.2");

            // Eye tracking
            window.addEventListener('mousemove', (e) => {
                const eyes = document.getElementById('cashy-eyes');
                if (!eyes) return;
                const rect = eyes.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                const dist = 3;
                gsap.to(eyes, { 
                    x: Math.cos(angle) * dist, 
                    y: Math.sin(angle) * dist, 
                    duration: 0.4,
                    ease: "power2.out"
                });
            });
        });
    </script>

    <!-- App Scripts -->
    <script src="js/config.js?v=12" defer></script>
    <script src="auth.js?v=12" defer></script>
</body>
</html>
