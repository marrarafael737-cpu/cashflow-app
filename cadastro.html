<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>C.A.S.H. Unit - Solicitar Credenciais</title>

    <!-- Meta Tags SEO -->
    <meta name="description"
        content="Solicite suas credenciais e registre-se no C.A.S.H. Unit. Gestão de finanças inteligentes com inteligência artificial.">
    <meta property="og:title" content="C.A.S.H. Unit - Registrar Novo Operador">
    <meta property="og:description"
        content="Solicite suas credenciais e registre-se no C.A.S.H. Unit. Gestão de finanças inteligentes com inteligência artificial.">
    <meta name="theme-color" content="#FF7A00">

    <!-- PWA Mobile Configuration -->
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="CashFlow">
    <link rel="apple-touch-icon" href="assets/mascot.svg">

    <!-- Security Headers -->
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com https://cdnjs.cloudflare.com; font-src 'self' https://fonts.gstatic.com https://cdnjs.cloudflare.com; img-src 'self' data: https://*; connect-src 'self' https://wecvchpyutwjqxoeilgq.supabase.co; frame-ancestors 'none';">
    <meta http-equiv="X-Content-Type-Options" content="nosniff">
    <meta http-equiv="X-Frame-Options" content="DENY">
    <meta name="referrer" content="strict-origin-when-cross-origin">

    <!-- Fontes Premium & Estilos Base -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&family=Outfit:wght@300;400;500;600;700;800&display=swap">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
        integrity="sha384-iw3OoTErCYJJB9mCa8LNS2hbsQ7M3C0EpIsO/H5+EGAkPGc6rk+V8i04oW/K5xq0" crossorigin="anonymous">
    <link rel="stylesheet" href="css/base.css">
    <link rel="stylesheet" href="css/animations.css">
    <link rel="stylesheet" href="css/components.css">
    <link rel="stylesheet" href="css/layout.css">
    <link rel="stylesheet" href="css/views.css">
    <link rel="stylesheet" href="css/mascot.css">

    <style>
        :root {
            --glass-bg: rgba(13, 13, 18, 0.7);
            --glass-border: rgba(255, 255, 255, 0.08);
            --glass-blur: blur(25px);
        }

        body {
            background-color: #050507;
            background-image:
                radial-gradient(circle at 10% 10%, rgba(255, 122, 0, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 90%, rgba(255, 122, 0, 0.05) 0%, transparent 40%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: 'Inter', sans-serif;
            margin: 0;
            overflow-x: hidden;
            color: #fff;
        }

        .auth-wrapper {
            width: 100%;
            max-width: 440px;
            padding: 1.5rem;
            z-index: 10;
        }

        .auth-card {
            background: var(--glass-bg);
            backdrop-filter: var(--glass-blur);
            -webkit-backdrop-filter: var(--glass-blur);
            border: 1px solid var(--glass-border);
            border-radius: 28px;
            padding: 3rem 2.5rem;
            box-shadow: 0 40px 80px -20px rgba(0, 0, 0, 0.6);
            position: relative;
            overflow: hidden;
        }

        .auth-header {
            text-align: center;
            margin-bottom: 2.5rem;
        }

        .auth-mascot-container {
            margin-bottom: 1.5rem;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .auth-mascot-svg {
            width: 110px;
            height: 110px;
            filter: drop-shadow(0 0 20px rgba(255, 122, 0, 0.15));
        }

        .auth-speech {
            background: rgba(255, 122, 0, 0.1);
            border: 1px solid rgba(255, 122, 0, 0.2);
            color: var(--color-primary);
            padding: 0.75rem 1.25rem;
            border-radius: 16px;
            font-size: 0.875rem;
            margin-bottom: 1rem;
            font-weight: 600;
            max-width: 90%;
            position: relative;
            animation: float 4s ease-in-out infinite;
        }

        @keyframes float {

            0%,
            100% {
                transform: translateY(0);
            }

            50% {
                transform: translateY(-6px);
            }
        }

        .auth-logo {
            font-family: 'Outfit', sans-serif;
            font-size: 2.2rem;
            font-weight: 800;
            letter-spacing: -0.05em;
            margin: 0;
            line-height: 1;
        }

        .auth-logo span {
            color: var(--color-primary);
            background: linear-gradient(135deg, #FF7A00 0%, #FFB800 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .form-group {
            margin-bottom: 1.25rem;
        }

        .form-label {
            display: block;
            margin-bottom: 0.5rem;
            font-size: 0.8rem;
            font-weight: 600;
            color: rgba(255, 255, 255, 0.6);
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .input-with-icon {
            position: relative;
        }

        .input-with-icon i {
            position: absolute;
            left: 1.25rem;
            top: 50%;
            transform: translateY(-50%);
            color: rgba(255, 255, 255, 0.2);
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .input-with-icon input {
            width: 100%;
            background: rgba(255, 255, 255, 0.03);
            border: 1px solid rgba(255, 255, 255, 0.08);
            border-radius: 14px;
            padding: 1rem 1.25rem 1rem 3.2rem;
            color: #fff;
            font-size: 0.95rem;
            transition: all 0.3s ease;
            box-sizing: border-box;
        }

        .input-with-icon input:focus {
            background: rgba(255, 255, 255, 0.06);
            border-color: var(--color-primary);
            outline: none;
        }

        .input-with-icon input:focus+i {
            color: var(--color-primary);
        }

        .btn-primary {
            width: 100%;
            background: linear-gradient(135deg, #FF7A00 0%, #FF5C00 100%);
            color: #000;
            border: none;
            border-radius: 14px;
            padding: 1.1rem;
            font-size: 1rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 0.75rem;
            margin-top: 1.5rem;
        }

        .btn-primary:hover {
            transform: translateY(-2px);
            filter: brightness(1.1);
            box-shadow: 0 10px 20px -5px rgba(255, 92, 0, 0.4);
        }

        .auth-footer {
            margin-top: 2rem;
            text-align: center;
            border-top: 1px solid rgba(255, 255, 255, 0.05);
            padding-top: 1.5rem;
        }

        .auth-footer p {
            color: var(--color-text-muted);
            font-size: 0.9rem;
        }

        .auth-footer a {
            color: var(--color-primary);
            text-decoration: none;
            font-weight: 700;
        }

        .cashy-visor {
            fill: #000;
        }

        .cashy-eye {
            fill: var(--color-primary);
        }
    </style>
</head>

<body>
    <main class="auth-wrapper">
        <div class="auth-card">
            <header class="auth-header">
                <div class="auth-mascot-container">
                    <div class="auth-speech">
                        <span id="auth-mascot-msg">Preparando novo terminal de acesso...</span>
                    </div>
                    <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg" class="auth-mascot-svg">
                        <defs>
                            <linearGradient id="bodyGradAuthCad" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" style="stop-color:#25252b" />
                                <stop offset="100%" style="stop-color:#0f0f12" />
                            </linearGradient>
                        </defs>
                        <rect x="50" y="50" width="100" height="90" rx="32" fill="url(#bodyGradAuthCad)" />
                        <circle cx="55" cy="65" r="12" fill="#1a1a1f" stroke="var(--color-primary)" stroke-width="2" />
                        <circle cx="145" cy="65" r="12" fill="#1a1a1f" stroke="var(--color-primary)" stroke-width="2" />
                        <rect x="62" y="78" width="76" height="34" rx="17" class="cashy-visor" />
                        <g id="cashy-eyes">
                            <rect x="75" y="90" width="16" height="5" rx="2.5" class="cashy-eye" />
                            <rect x="109" y="90" width="16" height="5" rx="2.5" class="cashy-eye" />
                        </g>
                    </svg>
                </div>

                <h1 class="auth-logo">C.A.S.H. <span>Unit</span></h1>
                <p class="auth-subtitle" style="color:var(--color-text-muted); font-size:0.9rem; margin-top:0.5rem;">
                    Registro de Novo Operador</p>
            </header>

            <form id="cadastro-form">
                <div class="form-group">
                    <label class="form-label" for="email">E-mail</label>
                    <div class="input-with-icon">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="email" required placeholder="seu@email.com">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="password">Nova Chave</label>
                    <div class="input-with-icon">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="password" required minlength="6" placeholder="Mínimo 6 caracteres">
                    </div>
                </div>

                <div class="form-group">
                    <label class="form-label" for="confirm-password">Confirmar Chave</label>
                    <div class="input-with-icon">
                        <i class="fas fa-check-double"></i>
                        <input type="password" id="confirm-password" required minlength="6"
                            placeholder="Repita a chave">
                    </div>
                </div>

                <button type="submit" id="btn-submit" class="btn-primary">
                    <span>Criar Registro</span>
                    <i class="fas fa-user-plus"></i>
                </button>
            </form>

            <footer class="auth-footer">
                <p>Já possui credenciais? <a href="login.html">Acessar Núcleo</a></p>
            </footer>
        </div>
    </main>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.43.2/dist/umd/supabase.min.js"
        integrity="sha384-3wUKeH0DH4hNxURtHPXhI66xVWrl+tDWOz20ylXdf6ph1BV3ylCCElOLZ83PH/kM"
        crossorigin="anonymous"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js"
        integrity="sha384-d+vyQ0dYcymoP8ndq2hW7FGC50nqGdXUEgoOUGxbbkAJwZqL7h+jKN0GGgn9hFDS"
        crossorigin="anonymous"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const anim = gsap.from(".auth-card", { scale: 0.95, opacity: 0, duration: 1, ease: "expo.out" });
            window.addEventListener('mousemove', (e) => {
                const eyes = document.getElementById('cashy-eyes');
                if (!eyes) return;
                const rect = eyes.getBoundingClientRect();
                const centerX = rect.left + rect.width / 2;
                const centerY = rect.top + rect.height / 2;
                const angle = Math.atan2(e.clientY - centerY, e.clientX - centerX);
                gsap.to(eyes, { x: Math.cos(angle) * 3, y: Math.sin(angle) * 3, duration: 0.4 });
            });
            // Cleanup: anim.kill() or ScrollTrigger.revert()
        });
    </script>
    <script src="js/config.js?v=12" defer></script>
    <script src="auth.js?v=12" defer></script>
</body>

</html>
